<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native JavaScript Code Beautifier</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
    }

    .app {
        width: min(1400px, 96%);
        margin: 30px auto;
    }

    h1 {
        margin-bottom: 6px;
    }

    .subtitle {
        color: #94a3b8;
        margin-top: 0;
    }

    .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 20px 0;
    }

    select,
    button {
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 14px;
        background: #1e293b;
        color: #e2e8f0;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover,
    select:hover {
        background: #334155;
    }

    .primary {
        background: #2563eb;
        border-color: #2563eb;
    }

    .primary:hover {
        background: #1d4ed8;
    }

    .editor {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .panel {
        display: flex;
        flex-direction: column;
    }

    .panel-title {
        padding: 10px 12px;
        background: #1e293b;
        border-radius: 8px 8px 0 0;
        color: #94a3b8;
        font-size: 13px;
    }

    textarea {
        width: 100%;
        min-height: 600px;
        resize: vertical;
        border: 1px solid #334155;
        border-top: 0;
        outline: none;
        padding: 16px;
        border-radius: 0 0 8px 8px;
        background: #020617;
        color: #e2e8f0;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 14px;
        line-height: 1.6;
        tab-size: 4;
    }

    .status {
        margin-top: 10px;
        color: #94a3b8;
        font-size: 13px;
    }

    @media (max-width: 900px) {
        .editor {
            grid-template-columns: 1fr;
        }

        textarea {
            min-height: 400px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <h1>Code Beautifier</h1>
    <p class="subtitle">
        Native JavaScript • No dependencies • Multiple programming languages
    </p>

    <div class="toolbar">

        <select id="language">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="json">JSON</option>
            <option value="css">CSS</option>
            <option value="html">HTML</option>
            <option value="xml">XML</option>
            <option value="sql">SQL</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="c">C / C++</option>
            <option value="csharp">C#</option>
            <option value="php">PHP</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>
            <option value="yaml">YAML</option>
        </select>

        <select id="indent">
            <option value="2">2 spaces</option>
            <option value="4" selected>4 spaces</option>
            <option value="8">8 spaces</option>
            <option value="tab">Tabs</option>
        </select>

        <button class="primary" id="beautify">Beautify</button>
        <button id="minify">Minify</button>
        <button id="copy">Copy</button>
        <button id="download">Download</button>
        <button id="clear">Clear</button>

    </div>

    <div class="editor">

        <div class="panel">
            <div class="panel-title">Input</div>
            <textarea id="input" spellcheck="false"
placeholder="// Paste your code here

function hello(name){console.log('Hello, '+name)}"></textarea>
        </div>

        <div class="panel">
            <div class="panel-title">Output</div>
            <textarea id="output" spellcheck="false"></textarea>
        </div>

    </div>

    <div class="status" id="status">
        Ready
    </div>

</div>

<script>
"use strict";

/*
 * Native Multi-language Beautifier
 * No external dependencies.
 */

const input = document.getElementById("input");
const output = document.getElementById("output");
const language = document.getElementById("language");
const indentSelect = document.getElementById("indent");
const status = document.getElementById("status");

function getIndent() {
    return indentSelect.value === "tab"
        ? "\t"
        : " ".repeat(Number(indentSelect.value));
}

function setStatus(message) {
    status.textContent = message;
}

/* ---------------------------------------------------------
   Generic lexical scanner
--------------------------------------------------------- */

function tokenize(code) {
    const tokens = [];
    let current = "";
    let quote = null;
    let comment = null;

    for (let i = 0; i < code.length; i++) {
        const c = code[i];
        const n = code[i + 1];

        /* Line comment */
        if (!quote && !comment && c === "/" && n === "/") {
            if (current) {
                tokens.push(current);
                current = "";
            }

            let value = "//";
            i += 2;

            while (i < code.length && code[i] !== "\n") {
                value += code[i++];
            }

            tokens.push(value);
            i--;
            continue;
        }

        /* Block comment */
        if (!quote && !comment && c === "/" && n === "*") {
            if (current) {
                tokens.push(current);
                current = "";
            }

            let value = "/*";
            i += 2;

            while (i < code.length) {
                value += code[i];

                if (code[i] === "*" && code[i + 1] === "/") {
                    value += "/";
                    i++;
                    break;
                }

                i++;
            }

            tokens.push(value);
            continue;
        }

        /* String */
        if (!comment && (c === "'" || c === '"' || c === "`")) {

            if (!quote) {
                if (current) {
                    tokens.push(current);
                    current = "";
                }

                quote = c;
                current = c;
                continue;
            }

            current += c;

            if (c === quote && code[i - 1] !== "\\") {
                tokens.push(current);
                current = "";
                quote = null;
            }

            continue;
        }

        if (quote) {
            current += c;
            continue;
        }

        /* Whitespace */
        if (/\s/.test(c)) {
            if (current) {
                tokens.push(current);
                current = "";
            }
            continue;
        }

        /* Symbols */
        if ("{}[]();,:.".includes(c)) {
            if (current) {
                tokens.push(current);
                current = "";
            }

            tokens.push(c);
            continue;
        }

        /* Operators */
        const two = c + n;
        const three = two + code[i + 2];

        if (
            ["==", "!=", "<=", ">=", "=>", "++", "--",
             "&&", "||", "+=", "-=", "*=", "/=", "??",
             "?.", "**", "<<", ">>", "::"].includes(two)
        ) {
            if (current) {
                tokens.push(current);
                current = "";
            }

            tokens.push(two);
            i++;
            continue;
        }

        if (
            ["===", "!==", ">>>", "**="].includes(three)
        ) {
            if (current) {
                tokens.push(current);
                current = "";
            }

            tokens.push(three);
            i += 2;
            continue;
        }

        if ("=+-*/%<>!&|?".includes(c)) {
            if (current) {
                tokens.push(current);
                current = "";
            }

            tokens.push(c);
            continue;
        }

        current += c;
    }

    if (current) {
        tokens.push(current);
    }

    return tokens;
}

/* ---------------------------------------------------------
   JavaScript / TypeScript
--------------------------------------------------------- */

function beautifyJavaScript(code) {

    const tokens = tokenize(code);
    const indent = getIndent();

    let level = 0;
    let line = "";
    const lines = [];

    function write(value) {
        line += value;
    }

    function trim() {
        line = line.trimEnd();
    }

    function newline(force = false) {
        trim();

        if (line || force) {
            lines.push(indent.repeat(Math.max(0, level)) + line.trim());
        }

        line = "";
    }

    function previous() {
        return tokens[index - 1];
    }

    let index = 0;

    while (index < tokens.length) {

        const token = tokens[index];
        const prev = tokens[index - 1];
        const next = tokens[index + 1];

        if (token.startsWith("//")) {
            if (line.trim()) {
                write(" " + token);
                newline();
            } else {
                write(token);
                newline();
            }

            index++;
            continue;
        }

        if (token.startsWith("/*")) {
            if (line.trim()) {
                write(" " + token);
                newline();
            } else {
                write(token);
                newline();
            }

            index++;
            continue;
        }

        if (token === "{") {

            if (line && !line.endsWith(" ")) {
                write(" ");
            }

            write("{");
            newline();
            level++;

            index++;
            continue;
        }

        if (token === "}") {

            if (line.trim()) {
                newline();
            }

            level--;

            write("}");

            if (next !== ";" && next !== "," && next !== ")" && next !== "]") {
                newline();
            }

            index++;
            continue;
        }

        if (token === ";") {
            trim();
            write(";");

            /*
             * Do not break semicolons inside for(...)
             */
            let parens = 0;

            for (let j = index - 1; j >= 0; j--) {
                if (tokens[j] === ")") parens++;
                if (tokens[j] === "(") {
                    if (parens === 0) break;
                    parens--;
                }
            }

            if (parens === 0) {
                newline();
            } else {
                write(" ");
            }

            index++;
            continue;
        }

        if (token === ",") {
            trim();
            write(",");

            if (next) {
                write(" ");
            }

            index++;
            continue;
        }

        if (token === ".") {
            trim();
            write(".");
            index++;
            continue;
        }

        if (token === "(") {
            trim();
            write("(");
            index++;
            continue;
        }

        if (token === ")") {
            trim();
            write(")");
            index++;
            continue;
        }

        if (token === "[") {
            trim();
            write("[");
            index++;
            continue;
        }

        if (token === "]") {
            trim();
            write("]");
            index++;
            continue;
        }

        /*
         * Operators
         */
        if (
            ["=", "+", "-", "*", "/", "%", "==", "===",
             "!=", "!==", "<", ">", "<=", ">=", "=>",
             "&&", "||", "??", "+=", "-=", "*=", "/=",
             "?", "|", "&"].includes(token)
        ) {
            trim();
            write(" " + token + " ");
            index++;
            continue;
        }

        /*
         * Keywords that commonly begin a new statement
         */
        if (
            ["if", "else", "for", "while", "switch",
             "catch", "finally", "function", "class",
             "try", "do"].includes(token)
        ) {

            if (line.trim() &&
                !line.trim().endsWith("(")) {
                newline();
            }

            write(token);

            if (next !== "(" && next !== "{") {
                write(" ");
            }

            index++;
            continue;
        }

        /*
         * else / catch after closing brace
         */
        if (token === "else" || token === "catch" || token === "finally") {
            trim();

            if (line.endsWith("}")) {
                write(" ");
            }

            write(token);

            if (next === "{") {
                write(" ");
            } else {
                write(" ");
            }

            index++;
            continue;
        }

        /*
         * Normal words / strings / numbers
         */
        if (
            line &&
            !line.endsWith(" ") &&
            prev !== "." &&
            prev !== "(" &&
            prev !== "[" &&
            prev !== "{" &&
            !["++", "--"].includes(token)
        ) {
            write(" ");
        }

        write(token);

        index++;
    }

    if (line.trim()) {
        newline();
    }

    return lines.join("\n");
}

/* ---------------------------------------------------------
   JSON
--------------------------------------------------------- */

function beautifyJSON(code) {

    const indent = getIndent();

    try {
        const parsed = JSON.parse(code);
        return JSON.stringify(parsed, null, indent);
    } catch (error) {

        /*
         * JSON5-ish fallback.
         */
        return beautifyBraces(code);
    }
}

/* ---------------------------------------------------------
   HTML / XML
--------------------------------------------------------- */

function beautifyHTML(code) {

    const indent = getIndent();

    code = code
        .replace(/>\s+</g, "><")
        .replace(/</g, "\n<")
        .replace(/>/g, ">\n");

    const raw = code
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    const lines = [];
    let level = 0;

    for (let line of raw) {

        if (line.startsWith("</")) {
            level--;
        }

        if (
            line.startsWith("</") ||
            line.startsWith("<!")
        ) {
            lines.push(indent.repeat(Math.max(0, level)) + line);
        } else {

            lines.push(indent.repeat(level) + line);

            if (
                line.startsWith("<") &&
                !line.startsWith("<!") &&
                !line.startsWith("<?") &&
                !line.startsWith("<input") &&
                !line.startsWith("<img") &&
                !line.startsWith("<br") &&
                !line.startsWith("<hr") &&
                !line.startsWith("<meta") &&
                !line.startsWith("<link") &&
                !line.includes("</")
            ) {
                level++;
            }
        }
    }

    return lines.join("\n");
}

/* ---------------------------------------------------------
   CSS
--------------------------------------------------------- */

function beautifyCSS(code) {

    const indent = getIndent();

    code = code
        .replace(/\/\*[\s\S]*?\*\//g, m => "\n" + m + "\n")
        .replace(/\{/g, "{\n")
        .replace(/;/g, ";\n")
        .replace(/\}/g, "\n}\n");

    const raw = code
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    let level = 0;
    const lines = [];

    for (const line of raw) {

        if (line === "}") {
            level--;
        }

        lines.push(indent.repeat(Math.max(0, level)) + line);

        if (line.endsWith("{")) {
            level++;
        }
    }

    return lines.join("\n");
}

/* ---------------------------------------------------------
   SQL
--------------------------------------------------------- */

function beautifySQL(code) {

    const indent = getIndent();

    code = code
        .replace(/\s+/g, " ")
        .replace(/\s*,\s*/g, ", ")
        .replace(/\s*\(\s*/g, " (")
        .replace(/\s*\)\s*/g, ") ");

    const keywords = [
        "SELECT",
        "FROM",
        "WHERE",
        "GROUP BY",
        "ORDER BY",
        "HAVING",
        "LIMIT",
        "OFFSET",
        "JOIN",
        "INNER JOIN",
        "LEFT JOIN",
        "RIGHT JOIN",
        "FULL JOIN",
        "CROSS JOIN",
        "UNION",
        "UNION ALL",
        "INSERT INTO",
        "VALUES",
        "UPDATE",
        "SET",
        "DELETE FROM"
    ];

    const regex = new RegExp(
        "\\b(" +
        keywords
            .sort((a, b) => b.length - a.length)
            .map(x => x.replace(/ /g, "\\s+"))
            .join("|") +
        ")\\b",
        "gi"
    );

    code = code.replace(regex, "\n$1");

    const lines = code
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    return lines
        .map((line, i) => {
            return i === 0 ? line : indent + line;
        })
        .join("\n");
}

/* ---------------------------------------------------------
   Python
--------------------------------------------------------- */

function beautifyPython(code) {

    const indent = getIndent();
    const lines = code.split("\n");

    let level = 0;
    const output = [];

    for (let raw of lines) {

        let line = raw.trim();

        if (!line) {
            output.push("");
            continue;
        }

        /*
         * Python dedent keywords.
         */
        if (
            /^(elif|else|except|finally)\b/.test(line)
        ) {
            level = Math.max(0, level - 1);
        }

        /*
         * Basic operator spacing.
         */
        line = line
            .replace(/\s*=\s*/g, " = ")
            .replace(/\s*\+\s*/g, " + ")
            .replace(/\s*-\s*/g, " - ")
            .replace(/\s*\*\s*/g, " * ")
            .replace(/\s*\/\s*/g, " / ")
            .replace(/,\s*/g, ", ");

        output.push(indent.repeat(level) + line);

        /*
         * Block starters.
         */
        if (line.endsWith(":")) {
            level++;
        }
    }

    return output.join("\n");
}

/* ---------------------------------------------------------
   C-like languages
--------------------------------------------------------- */

function beautifyCLike(code) {

    /*
     * Java, C, C++, C#, Go, Rust and PHP
     * can share a basic brace formatter.
     */

    return beautifyBraces(code);
}

/* ---------------------------------------------------------
   Generic brace formatter
--------------------------------------------------------- */

function beautifyBraces(code) {

    const indent = getIndent();

    const tokens = tokenize(code);

    let level = 0;
    let line = "";
    const lines = [];

    function newline() {
        if (line.trim()) {
            lines.push(
                indent.repeat(Math.max(0, level)) +
                line.trim()
            );
        }

        line = "";
    }

    for (let i = 0; i < tokens.length; i++) {

        const token = tokens[i];

        if (token.startsWith("//")) {
            if (line.trim()) {
                line += " " + token;
            } else {
                line = token;
            }

            newline();
            continue;
        }

        if (token === "{") {

            line = line.trimEnd() + " {";
            newline();

            level++;
            continue;
        }

        if (token === "}") {

            if (line.trim()) {
                newline();
            }

            level--;

            line = "}";

            if (
                tokens[i + 1] &&
                tokens[i + 1] !== ";" &&
                tokens[i + 1] !== ","
            ) {
                newline();
            }

            continue;
        }

        if (token === ";") {

            line = line.trimEnd() + ";";
            newline();

            continue;
        }

        if (token === ",") {

            line = line.trimEnd() + ", ";

            continue;
        }

        if (token === "(") {
            line = line.trimEnd() + "(";
            continue;
        }

        if (token === ")") {
            line = line.trimEnd() + ")";
            continue;
        }

        if (token === "[") {
            line = line.trimEnd() + "[";
            continue;
        }

        if (token === "]") {
            line = line.trimEnd() + "]";
            continue;
        }

        if (token === ".") {
            line = line.trimEnd() + ".";
            continue;
        }

        if (
            ["=", "+", "-", "*", "/", "%",
             "==", "===", "!=", "!==",
             "<", ">", "<=", ">=", "&&",
             "||", "=>", "+=", "-=", "*="].includes(token)
        ) {
            line = line.trimEnd() + " " + token + " ";
            continue;
        }

        if (
            line &&
            !line.endsWith(" ") &&
            !line.endsWith("(") &&
            !line.endsWith("[") &&
            !line.endsWith(".")
        ) {
            line += " ";
        }

        line += token;
    }

    if (line.trim()) {
        newline();
    }

    return lines.join("\n");
}

/* ---------------------------------------------------------
   YAML
--------------------------------------------------------- */

function beautifyYAML(code) {

    const indent = getIndent();

    const lines = code
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    let level = 0;
    const output = [];

    for (const line of lines) {

        if (line.startsWith("- ")) {
            output.push(
                indent.repeat(Math.max(0, level - 1)) + line
            );
        } else {
            output.push(
                indent.repeat(level) + line
            );
        }

        if (
            line.endsWith(":") ||
            /^[^:#]+:\s*$/.test(line)
        ) {
            level++;
        }
    }

    return output.join("\n");
}

/* ---------------------------------------------------------
   Main formatter
--------------------------------------------------------- */

function beautify(code, lang) {

    switch (lang) {

        case "javascript":
        case "typescript":
            return beautifyJavaScript(code);

        case "json":
            return beautifyJSON(code);

        case "html":
        case "xml":
            return beautifyHTML(code);

        case "css":
            return beautifyCSS(code);

        case "sql":
            return beautifySQL(code);

        case "python":
            return beautifyPython(code);

        case "java":
        case "c":
        case "csharp":
        case "php":
        case "go":
        case "rust":
            return beautifyCLike(code);

        case "yaml":
            return beautifyYAML(code);

        default:
            return beautifyBraces(code);
    }
}

/* ---------------------------------------------------------
   Minifier
--------------------------------------------------------- */

function minifyCode(code, lang) {

    if (lang === "json") {

        try {
            return JSON.stringify(JSON.parse(code));
        } catch {
            return code
                .replace(/\s+/g, " ")
                .trim();
        }
    }

    /*
     * Preserve strings while removing comments/whitespace.
     */
    const tokens = tokenize(code);

    return tokens
        .filter(token => !token.startsWith("//") &&
                         !token.startsWith("/*"))
        .join(" ")
        .replace(/\s+([{}[\]();,:.])/g, "$1")
        .replace(/([{}[\]();,:.])\s+/g, "$1")
        .replace(/\s+/g, " ")
        .trim();
}

/* ---------------------------------------------------------
   Buttons
--------------------------------------------------------- */

document.getElementById("beautify").addEventListener("click", () => {

    const code = input.value;

    if (!code.trim()) {
        output.value = "";
        setStatus("Nothing to format.");
        return;
    }

    try {

        const result = beautify(
            code,
            language.value
        );

        output.value = result;

        setStatus(
            `Formatted ${result.length.toLocaleString()} characters.`
        );

    } catch (error) {

        output.value = code;

        setStatus(
            "Formatting error: " + error.message
        );
    }
});

document.getElementById("minify").addEventListener("click", () => {

    const code = input.value;

    if (!code.trim()) {
        output.value = "";
        return;
    }

    try {

        output.value = minifyCode(
            code,
            language.value
        );

        setStatus("Code minified.");

    } catch (error) {

        setStatus(
            "Minification error: " + error.message
        );
    }
});

document.getElementById("copy").addEventListener("click", async () => {

    if (!output.value) {
        setStatus("Nothing to copy.");
        return;
    }

    try {

        await navigator.clipboard.writeText(output.value);
        setStatus("Copied to clipboard.");

    } catch {

        output.select();
        document.execCommand("copy");
        setStatus("Copied to clipboard.");
    }
});

document.getElementById("clear").addEventListener("click", () => {

    input.value = "";
    output.value = "";

    setStatus("Cleared.");
});

document.getElementById("download").addEventListener("click", () => {

    if (!output.value) {
        setStatus("Nothing to download.");
        return;
    }

    const extensions = {
        javascript: "js",
        typescript: "ts",
        json: "json",
        html: "html",
        xml: "xml",
        css: "css",
        sql: "sql",
        python: "py",
        java: "java",
        c: "c",
        csharp: "cs",
        php: "php",
        go: "go",
        rust: "rs",
        yaml: "yaml"
    };

    const ext = extensions[language.value] || "txt";

    const blob = new Blob(
        [output.value],
        { type: "text/plain;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = `beautified.${ext}`;

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

    setStatus(`Downloaded beautified.${ext}`);
});

/* ---------------------------------------------------------
   Keyboard shortcuts
--------------------------------------------------------- */

document.addEventListener("keydown", event => {

    if (
        (event.ctrlKey || event.metaKey) &&
        event.key === "Enter"
    ) {
        event.preventDefault();

        document.getElementById("beautify").click();
    }

    if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "s"
    ) {
        event.preventDefault();

        document.getElementById("download").click();
    }
});

/* ---------------------------------------------------------
   Tab support
--------------------------------------------------------- */

input.addEventListener("keydown", event => {

    if (event.key === "Tab") {

        event.preventDefault();

        const indent = getIndent();

        const start = input.selectionStart;
        const end = input.selectionEnd;

        input.value =
            input.value.substring(0, start) +
            indent +
            input.value.substring(end);

        input.selectionStart =
            input.selectionEnd =
            start + indent.length;
    }
});
